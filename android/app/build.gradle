plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seasonrunner.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.seasonrunner.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Copy the web game into assets before building
    tasks.register('syncWebAssets', Copy) {
        from "${rootProject.projectDir}/../web"
        into "${projectDir}/src/main/assets/web"
        include '**/*'
        exclude '**/*.map'
    }

    preBuild.dependsOn syncWebAssets
}

// kotlin-stdlib 1.8+ already ships the jdk7/jdk8 classes; the old
// kotlin-stdlib-jdk7/jdk8 1.6.x artifacts pulled in transitively would
// cause duplicate-class errors at dex time.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
